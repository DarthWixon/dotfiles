;==========================================================
[everforest]
; Polybar names for colours in ~/.config/colors/everforest.ini — edit values there, not here.
black        = ${palette.bg0}
dark         = ${palette.bg_dim}
disabled     = ${palette.bg3}
red          = ${palette.red}
red-alt      = ${palette.bg_red}
orange       = ${palette.orange}
orange-mat   = ${palette.orange}
yellow       = ${palette.yellow}
yellow-mat   = ${palette.yellow}
green        = ${palette.green}
aqua         = ${palette.aqua}
blue         = ${palette.blue}
blue-alt     = ${palette.blue}
grey         = ${palette.grey1}
dark-grey    = ${palette.bg_dim}
cream        = ${palette.fg}
white        = ${palette.fg}
transparent  = ${palette.transparent}
; bg_dim at 80% opacity — polybar can't add alpha to a reference
Stransparent = #CC232A2E

[colors]
urgent = ${everforest.red}
success = ${everforest.aqua}
warning = ${everforest.yellow}
foreground = ${everforest.cream}
